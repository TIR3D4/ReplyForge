name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q replyforge
      - name: Static checks
        run: ruff check --select E4,E7,E9,F replyforge
      - name: Tests
        run: pytest -q

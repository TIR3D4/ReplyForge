name: CI
on:
  push:
    branches: [main, "feat/**", "development/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: replyforge_test
          POSTGRES_USER: replyforge
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replyforge -d replyforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.lock -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q replyforge
      - name: Static checks
        run: ruff check --select E4,E7,E9,F replyforge
      - name: Tests
        run: pytest -q --junitxml=artifacts/unit.xml
      - name: PostgreSQL integration
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://replyforge:ci-only-password@localhost:5432/replyforge_test
        run: pytest -q tests/test_postgres.py --junitxml=artifacts/postgres.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: artifacts/*.xml

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment topology
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci-placeholder-password docker compose --profile vpn config --quiet
      - name: Build production container
        run: docker build --tag replyforge-ci .
      - name: Verify playbook is present
        run: docker run --rm replyforge-ci replyforge check-config
      - name: Exercise migration in container
        run: |
          docker run --rm \
            -e BOT_TOKEN="123:ci-test" \
            -e WEBHOOK_SECRET="01234567890123456789012345678900" \
            -e ADMIN_PASSWORD="01234567890123456789" \
            -e BINDING_PEPPER="01234567890123456789012345678900" \
            -e INTERNAL_API_KEY="01234567890123456789012345678900" \
            -e DATABASE_URL="sqlite+pysqlite:////tmp/replyforge-ci.db" \
            replyforge-ci replyforge init
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: Disposable deployment, restart, backup and restore
        run: python scripts/deployment_smoke.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock -e ".[dev]" playwright==1.63.0
      - run: google-chrome --version
      - name: Desktop and mobile, Persian and English
        env:
          RUN_BROWSER_TESTS: "1"
          BROWSER_CHANNEL: chrome
        run: python -m pytest -q tests/test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: artifacts/ui

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock --no-deps --disable-pip --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json

  installation-package:
    needs: [test, docker-smoke, browser, dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build installation archive and checksum
        run: python scripts/package_release.py
      - name: Verify archive manifest
        run: python scripts/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ReplyForge-1.2.0rc1-installation
          path: dist/*

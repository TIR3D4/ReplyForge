services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: replyforge
      POSTGRES_USER: replyforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replyforge"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  init:
    build: .
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: 30s
    command: ["replyforge", "init"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://replyforge:${POSTGRES_PASSWORD}@db:5432/replyforge
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://replyforge:${POSTGRES_PASSWORD}@db:5432/replyforge
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: .
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: 30s
    command: ["replyforge", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://replyforge:${POSTGRES_PASSWORD}@db:5432/replyforge
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  insight:
    profiles: ["insight"]
    build: .
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: 30s
    command: ["replyforge", "insight-worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://replyforge:${POSTGRES_PASSWORD}@db:5432/replyforge
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  catalog:
    profiles: ["vpn"]
    build: .
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: 30s
    command: ["replyforge", "sync-daemon", "--provider", "both", "--limit", "2000", "--interval-minutes", "60"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://replyforge:${POSTGRES_PASSWORD}@db:5432/replyforge
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  pgdata:

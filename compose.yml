services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: replyforge
      POSTGRES_USER: replyforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replyforge"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://replyforge:${POSTGRES_PASSWORD}@db:5432/replyforge
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["replyforge", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://replyforge:${POSTGRES_PASSWORD}@db:5432/replyforge
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "replyforge"
version = "0.1.0"
description = "Self-hosted Telegram Business AI support with auditable workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "pytest-cov>=5,<8"]
[project.scripts]
replyforge = "replyforge.cli:main"

[tool.setuptools.packages.find]
include = ["replyforge*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
